[project]
name = "speckler"
version = "0.1.0"
description = "This project takes a laser and shines it into an occluded substrate attempting to focus a laser deeper via machine learning and digital micromirror devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cv2-enumerate-cameras>=1.3.3",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyserial>=3.5",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Might need to remove this once we get the hardware

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]
