[project]
name = "speckler"
version = "0.1.0"
description = "This project takes a laser and shines it into an occluded substrate attempting to focus a laser deeper via machine learning and digital micromirror devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyserial>=3.5",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]
